name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main # Change to master if your primary branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🛠️ FIX: Manually move into frontend, install, and run build
      - name: Build React App
        run: |
          cd frontend
          npm install
          CI=false npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 🛠️ FIX: Target the build folder directly relative to the runner workspace
      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/build/' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
